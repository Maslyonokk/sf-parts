<!DOCTYPE html>
<html>

    <head>
        <title> Parts Picker </title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="page" id="page">
            <div class="links" id="links">
                <a href="#page">Back to top </a>
            </div>

            <div class="codes-area" >
                <p id="output-text-field"></p>

            </div>
            <button id="copy-button">Copy</button>
            <button id="clear-button">Clear All</button>

            <div id="parts">
                <h3 id="most_used">Most Used</h3>
                    <div class="grid" id="parts-most-used">
                    </div>
                <h3 id="Wheel">Wheel</h3>
                    <div class="grid" id="parts-wheel">
                    </div>
                <h3 id="Brakes">Brakes</h3>
                    <div class="grid" id="parts-brakes">
                    </div>
                <h3 id="Fenders">Fenders</h3>
                    <div class="grid" id="parts-fenders">
                    </div>
                <h3 id="Drivetrain">Drivetrain</h3>
                    <div class="grid" id="parts-drivetrain">
                    </div>
                <h3 id="Gears">Gears</h3>
                    <div class="grid" id="parts-gears">
                    </div>
                <h3 id="Chainguard">Chainguard</h3>
                    <div class="grid" id="parts-chainguard">
                    </div>
                <h3 id="Steering">Steering</h3>
                    <div class="grid" id="parts-steering">
                    </div>
                <h3 id="Carrier">Carrier</h3>
                    <div class="grid" id="parts-carrier">
                    </div>
                <h3 id="Frame">Frame</h3>
                    <div class="grid" id="parts-frame">
                    </div>
                <h3 id="Lights">Lights</h3>
                    <div class="grid" id="parts-lights">
                    </div>
                <h3 id="Locks">Locks</h3>
                    <div class="grid" id="parts-locks">
                    </div>
                <h3 id="Saddle">Saddle</h3>
                    <div class="grid" id="parts-saddle">
                    </div>
                <h3 id="Hardware">Hardware</h3>
                    <div class="grid" id="parts-hardware">
                    </div>
            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
