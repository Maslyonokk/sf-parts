<!DOCTYPE html>
<html>

    <head>
        <title> Parts Picker </title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="page">
            <div class="codes-area" >
                <p id="output-text-field"></p>

            </div>
            
            <button id="copy-button">Copy</button>
            <button id="clear-button">Clear All</button>

            <div class="grid" id="parts">
                <div class="part-card" id="190111">
                    <img src="imgs\kmc-sprocket-18t-r-shimano-3-32-black-8719189051056-0-l.webp">
                    <p class="part-name">Sprocket</p>
                    <p class="sku-number">190111</p>
                </div>
                <div class="part-card" id="110106">
                    <img src="imgs\cordo-anti-fray-nipple.webp">
                    <p class="part-name">Cable end</p>
                    <p class="sku-number">280456</p>
                </div>
                <div class="part-card" id="122894">
                    <img src="imgs\shimano-nexus-revo-.webp">
                    <p class="part-name">Shifter</p>
                    <p class="sku-number">122894</p>
                </div>
                <div class="part-card" id="350167">
                    <img src="imgs\flange_nut_8.webp">
                    <p class="part-name">Flange nut 8</p>
                    <p class="sku-number">350167</p>
                </div>
                <div class="part-card" id="350124">
                    <img src="imgs\bolt_M5_1.webp">
                    <p class="part-name">Bolt M5 Inbus 5</p>
                    <p class="sku-number">350124</p>
                </div>
                <div class="part-card" id="350123">
                    <img src="imgs\m5_washer.webp">
                    <p class="part-name">Washer M5</p>
                    <p class="sku-number">350123</p>
                </div>


            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
