<!DOCTYPE html>
<html>

    <head>
        <title> Parts Picker </title>
        <link href="style.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">

    </head>

    <body>
        <div class="page">
            <div class="codes-area" >
                <p id="output-text-field"></p>

            </div>
            <button id="copy-button">Copy</button>
            <button id="clear-button">Clear All</button>

            <div id="parts">
                <h3>Most Used</h3>
                    <div class="grid" id="parts-most-used">
                    </div>
                <h3>Wheel</h3>
                    <div class="grid" id="parts-wheel">
                    </div>
                <h3>Brakes</h3>
                    <div class="grid" id="parts-brakes">
                    </div>
                <h3>Fenders</h3>
                    <div class="grid" id="parts-fenders">
                    </div>
                <h3>Drivetrain</h3>
                    <div class="grid" id="parts-drivetrain">
                    </div>
                <h3>Gears</h3>
                    <div class="grid" id="parts-gears">
                    </div>
                <h3>Chainguard</h3>
                    <div class="grid" id="parts-chainguard">
                    </div>
                <h3>Steering</h3>
                    <div class="grid" id="parts-steering">
                    </div>
                <h3>Carrier</h3>
                    <div class="grid" id="parts-carrier">
                    </div>
                <h3>Frame</h3>
                    <div class="grid" id="parts-frame">
                    </div>
                <h3>Lights</h3>
                    <div class="grid" id="parts-lights">
                    </div>
                <h3>Locks</h3>
                    <div class="grid" id="parts-locks">
                    </div>
                <h3>Saddle</h3>
                    <div class="grid" id="parts-saddle">
                    </div>
                <h3>Hardware</h3>
                    <div class="grid" id="parts-hardware">
                    </div>
            </div>

        </div>
        <script src="script.js"></script>
    </body>

</html>
